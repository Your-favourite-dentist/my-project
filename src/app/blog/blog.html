<div class="bg-gray-900 min-h-screen" dir="rtl">

  <section class="py-16 text-center">
    <div class="max-w-screen-xl mx-auto px-4">

      <span class="inline-block px-3 py-1 mb-4 text-sm text-orange-400 bg-orange-500/10 border border-orange-500/20 rounded-full">
        مدونتنا
      </span>

      <h1 class="text-3xl md:text-5xl font-bold text-white mb-4">
        استكشف <span class="text-orange-400">مقالاتنا</span>
      </h1>

      <p class="text-gray-400 max-w-2xl mx-auto mb-10">
        دروس ورؤى وأفضل الممارسات للتطوير الحديث
      </p>

      <div class="flex flex-wrap justify-center gap-2 mb-8">
        @for (cat of categories; track cat) {
          <button (click)="filterByCategory(cat)"
                  class="px-4 py-2 text-sm rounded-full border transition"
                  [class]="selectedCategory === cat
                    ? 'bg-orange-500 text-white border-orange-500'
                    : 'bg-gray-800 text-gray-300 border-gray-700 hover:border-orange-500'">
            {{ cat === 'الكل' ? 'جميع المقالات' : cat }}
          </button>
        }
      </div>

    </div>
  </section>
<div class="max-w-md mx-auto mb-8">
  <input
    type="text"
    [(ngModel)]="searchText"
    (ngModelChange)="applyFilters()"
    placeholder="ابحث في المقالات..."
    class="w-full px-5 py-3 text-white bg-gray-800 border border-gray-700 rounded-xl placeholder-gray-500 focus:outline-none focus:border-orange-500"
  />
</div>




  <section class="pb-16">
    <div class="max-w-screen-xl mx-auto px-4">

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (post of posts; track post.id) {
          <app-post-card [post]="post" />
        }
      </div>

      @if (posts.length === 0) {
        <div class="text-center py-20">
          <p class="text-gray-400 text-lg">لا توجد مقالات في هذا التصنيف</p>
        </div>
      }
      @if (totalPages > 1) {
  <div class="flex items-center justify-center gap-2 mt-12">

    <button (click)="prevPage()"
            [disabled]="currentPage === 1"
            class="px-4 py-2 text-sm rounded-lg border border-gray-700 text-gray-300 hover:border-orange-500 disabled:opacity-40 disabled:cursor-not-allowed transition">
      السابق
    </button>

    @for (page of pages; track page) {
      <button (click)="goToPage(page)"
              class="w-10 h-10 text-sm rounded-lg border transition"
              [class]="currentPage === page
                ? 'bg-orange-500 text-white border-orange-500'
                : 'border-gray-700 text-gray-300 hover:border-orange-500'">
        {{ page }}
      </button>
    }

    <button (click)="nextPage()"
            [disabled]="currentPage === totalPages"
            class="px-4 py-2 text-sm rounded-lg border border-gray-700 text-gray-300 hover:border-orange-500 disabled:opacity-40 disabled:cursor-not-allowed transition">
      التالي
    </button>

  </div>
}





    </div>
  </section>

</div>
