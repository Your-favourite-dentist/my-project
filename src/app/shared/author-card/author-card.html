<div class="group flex flex-col items-center text-center p-6 rounded-2xl bg-gray-800/50 border border-gray-700 hover:border-orange-500 transition-all duration-300">
  
  <div class="relative mb-4">
    <img [src]="avatar" [alt]="name"
         class="w-20 h-20 rounded-full object-cover border-2 border-gray-600 group-hover:border-orange-500 transition">
    <span class="absolute bottom-0 right-0 w-5 h-5 bg-orange-500 rounded-full border-2 border-gray-800 flex items-center justify-center">
      <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 24 24">
        <path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17Z"/>
      </svg>
    </span>
  </div>

  <h3 class="text-base font-bold text-white mb-1">{{ name }}</h3>
  
  <p class="text-sm text-orange-400 mb-4">{{ role }}</p>

  <div class="flex items-center gap-2">

    <a href="#" class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-700/50 text-gray-400 hover:bg-orange-500 hover:text-white transition">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.725-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/>
      </svg>
    </a>

    <a href="#" class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-700/50 text-gray-400 hover:bg-gray-500 hover:text-white transition">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0c2.5-3 4-6.5 4-9s-1.5-6-4-9m0 18c-2.5-3-4-6.5-4-9s1.5-6 4-9m-7 9h14"/>
      </svg>
    </a>

   
    <a href="#" class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-700/50 text-gray-400 hover:bg-blue-600 hover:text-white transition">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
    </a>

  </div>
</div>
