<a [routerLink]="['/blog', post.slug]"
   class="group flex flex-col md:flex-row bg-gray-800/50 border border-gray-700 rounded-2xl overflow-hidden hover:border-orange-500/50 hover:shadow-lg hover:shadow-orange-500/10 transition-all duration-300">

  <div class="relative md:w-1/2 overflow-hidden">
    <img [src]="post.image" [alt]="post.title"
         class="w-full h-64 md:h-full object-cover group-hover:scale-105 transition duration-500">

    @if (post.featured) {
      <span class="absolute top-3 left-3 inline-flex items-center gap-1 px-2 py-1 text-xs bg-orange-500 text-white rounded-full">
        <svg class="w-3.5 h-3.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
          <path d="M13.849 4.22c-.684-1.626-3.014-1.626-3.698 0L8.397 8.303l-4.552.361c-1.775.14-2.495 2.331-1.142 3.477l3.468 2.937-1.06 4.392c-.413 1.713 1.472 3.067 2.992 2.149L12 19.35l3.897 2.269c1.52.918 3.405-.436 2.992-2.15l-1.06-4.39 3.468-2.938c1.353-1.146.633-3.336-1.142-3.477l-4.552-.36-1.754-4.084Z"/>
        </svg>
        مميز
      </span>
    }
  </div>

  <div class="p-6 md:w-1/2 flex flex-col justify-between">
    <div>
      <div class="flex items-center gap-3 text-sm text-gray-400 mb-3">
        <span class="px-2 py-0.5 bg-gray-700 rounded text-orange-300">{{ post.category }}</span>
        <span class="flex items-center gap-1">
          <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
          </svg>
          {{ post.readTime }}
        </span>
      </div>

      <h3 class="text-xl md:text-2xl font-bold text-white mb-2 group-hover:text-orange-400 transition">
        {{ post.title }}
      </h3>

      <p class="text-gray-400 text-sm mb-4 line-clamp-2">
        {{ post.excerpt }}
      </p>
    </div>

    <div class="flex items-center justify-between mt-4">
      <div class="flex items-center gap-2">
        <img [src]="post.author.avatar" [alt]="post.author.name"
             class="w-8 h-8 rounded-full object-cover">
        <div>
          <p class="text-sm text-white">{{ post.author.name }}</p>
          <p class="text-xs text-gray-500">{{ post.date }}</p>
        </div>
      </div>

      <span class="text-sm text-orange-400 group-hover:text-orange-300 flex items-center gap-1">
        <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12l4-4m-4 4 4 4"/>
        </svg>
      </span>
    </div>
  </div>

</a>
